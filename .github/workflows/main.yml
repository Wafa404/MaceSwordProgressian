
name: Build Minecraft Plugin

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build plugin
        run: mvn --batch-mode clean package

      - name: Save JAR
        uses: actions/upload-artifact@v4
        with:
          name: MaceSwordProgression
          path: target/*.jar
